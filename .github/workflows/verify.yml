name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pages-up-to-date:
    name: Generated markup is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if someone edited a partial without re-running the stamper, or
      # hand-edited a generated region. This is the check that would have
      # caught the stale navigation on ten sub-pages.
      - run: node tools/build-pages.js --check
      - run: node tools/build-blog.js --check

  links:
    name: No broken links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # With 11 pages of hand-written relative paths at three directory depths,
      # a broken link is the most likely regression and the most damaging one
      # when a recruiter hits it.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,206,429
            --exclude-path ./_github-profile-readme
            --exclude '^https://(www\.)?linkedin\.com'
            './**/*.html'
          fail: true

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # checkJs over plain JS — no build step, nothing compiled, nothing shipped.
      # It has already caught dead code and a JSDoc comment that disagreed with
      # the function it documented.
      - run: npx --yes -p typescript@5 tsc --noEmit

  budget:
    name: Asset budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A cheap guard against the thing that actually regresses on a static
      # site: someone drops in a 2MB hero image or a library "just this once".
      - name: Check asset sizes
        run: |
          fail=0
          check() {
            local path="$1" limit="$2"
            [ -e "$path" ] || return 0
            local size
            size=$(du -sk "$path" | cut -f1)
            if [ "$size" -gt "$limit" ]; then
              echo "::error::$path is ${size}KB, over the ${limit}KB budget"
              fail=1
            else
              echo "ok  $path  ${size}KB / ${limit}KB"
            fi
          }
          check css/style.css 110
          # Raised from 80KB when the CTF and live-metadata modules landed.
          # Deliberate: three Lab exhibits carry real logic. Revisit if it
          # climbs again without a feature behind it.
          check js 110
          check assets/fonts 120
          # Raised for the ten per-page social cards. These are fetched only by
          # social scrapers when a link is shared — never by a visitor loading a
          # page — so they cost nothing on the critical path. Split out so the
          # images that DO load stay under a tight limit.
          check assets/images/og 750
          # Case-study screenshots. Unlike the og/ cards these DO load for a
          # reader, so they get their own tight cap and are lazy-loaded in the
          # markup. Two images at 1200px wide, WebP q62. If this needs raising
          # again, ask whether the page needs another screenshot first.
          check assets/images/shots 160
          # Raised from 1000 for assets/images/shots. Everything else under
          # here is unchanged.
          check assets/images 1160
          exit $fail
